<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Biblioteca de Exercícios</title>
  <style>
    :root {
      --bg: #f4f4f5;
      --surface: #ffffff;
      --elevated: #f0f0f1;
      --border: #e4e4e7;
      --accent: #ff4f00;
      --accent-soft: rgba(255, 79, 0, 0.1);
      --text: #111111;
      --muted: #71717a;
      --faint: #a1a1aa;
      --radius: 12px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    button, input, select { font: inherit; }
    button { cursor: pointer; border: none; background: none; }
    img { display: block; max-width: 100%; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      line-height: 1.5;
      min-height: 100vh;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 16px 20px 14px;
    }

    .topbar-inner {
      max-width: 1120px;
      margin: 0 auto;
      display: grid;
      gap: 12px;
    }

    .brand-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.03em;
    }

    .brand span { color: var(--accent); }

    .setup-link {
      color: var(--muted);
      font-size: 13px;
      text-decoration: none;
    }

    .setup-link:hover { color: var(--accent); }

    .controls {
      display: grid;
      grid-template-columns: minmax(180px, 1.4fr) repeat(3, minmax(140px, 1fr));
      gap: 8px;
    }

    .search, .filter {
      width: 100%;
      height: 40px;
      padding: 0 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--elevated);
      color: var(--text);
      outline: none;
    }

    .search:focus, .filter:focus { border-color: var(--accent); background: var(--surface); }

    .meta-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      color: var(--muted);
      font-size: 13px;
    }

    .clear-btn {
      color: var(--muted);
      text-decoration: underline;
      text-underline-offset: 2px;
      display: none;
    }

    .clear-btn.visible { display: inline; }
    .clear-btn:hover { color: var(--text); }

    main {
      max-width: 1120px;
      margin: 0 auto;
      padding: 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 14px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      cursor: pointer;
      text-align: left;
      transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .card:hover {
      transform: translateY(-3px);
      border-color: var(--accent);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    }

    .card-media {
      aspect-ratio: 3 / 4;
      background: var(--elevated);
      overflow: hidden;
    }

    .card-media img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-body { padding: 10px 12px 12px; }

    .card-name {
      font-size: 13px;
      font-weight: 600;
      text-transform: capitalize;
      margin-bottom: 6px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-tags { display: flex; flex-wrap: wrap; gap: 4px; }

    .tag {
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 999px;
      background: var(--elevated);
      color: var(--muted);
      text-transform: capitalize;
    }

    .status {
      grid-column: 1 / -1;
      text-align: center;
      padding: 64px 16px;
      color: var(--muted);
    }

    .sentinel {
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .spinner {
      width: 20px;
      height: 20px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }

    .spinner.visible { display: block; }

    @keyframes spin { to { transform: rotate(360deg); } }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      z-index: 20;
    }

    .overlay.open { opacity: 1; pointer-events: auto; }

    .modal {
      width: min(640px, 100%);
      max-height: calc(100vh - 32px);
      overflow: auto;
      background: var(--surface);
      border-radius: 16px;
      padding: 20px;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .modal-title {
      font-size: 20px;
      font-weight: 700;
      text-transform: capitalize;
    }

    .close-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--elevated);
      color: var(--muted);
    }

    .close-btn:hover { color: var(--accent); }

    .modal-gif {
      width: 100%;
      max-height: 320px;
      object-fit: contain;
      background: var(--elevated);
      border-radius: 10px;
      margin-bottom: 14px;
    }

    .facts, .muscles, .steps {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }

    .fact {
      background: var(--elevated);
      border-radius: 10px;
      padding: 8px 12px;
      min-width: 120px;
    }

    .fact small, .section-label {
      display: block;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--faint);
      margin-bottom: 4px;
    }

    .fact strong { text-transform: capitalize; }

    .lang-tabs { display: flex; gap: 8px; margin-bottom: 10px; }

    .lang-tab {
      padding: 6px 10px;
      border-radius: 8px;
      color: var(--muted);
    }

    .lang-tab.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }

    .step {
      display: flex;
      gap: 10px;
      width: 100%;
      color: var(--muted);
    }

    .step-num {
      flex: 0 0 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--elevated);
      display: grid;
      place-items: center;
      font-size: 11px;
      font-weight: 700;
    }

    @media (max-width: 800px) {
      .controls { grid-template-columns: 1fr 1fr; }
      .search { grid-column: 1 / -1; }
    }

    @media (max-width: 560px) {
      .controls { grid-template-columns: 1fr; }
      .grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
      .overlay { align-items: flex-end; padding: 0; }
      .modal {
        width: 100%;
        max-height: 92dvh;
        border-radius: 16px 16px 0 0;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand-row">
        <div class="brand">Exercise<span>DB</span></div>
        <a class="setup-link" href="setup.html">Setup do banco</a>
      </div>
      <div class="controls">
        <input class="search" id="search" type="search" placeholder="Buscar exercício, músculo ou equipamento" autocomplete="off" />
        <select class="filter" id="body-part" aria-label="Parte do corpo">
          <option value="">Todas as partes</option>
        </select>
        <select class="filter" id="equipment" aria-label="Equipamento">
          <option value="">Todos os equipamentos</option>
        </select>
        <select class="filter" id="muscle" aria-label="Músculo">
          <option value="">Todos os músculos</option>
        </select>
      </div>
      <div class="meta-row">
        <span id="results-count">Carregando…</span>
        <button class="clear-btn" id="clear-filters" type="button">Limpar filtros</button>
      </div>
    </div>
  </header>

  <main>
    <div class="grid" id="grid"></div>
    <div class="sentinel" id="sentinel">
      <div class="spinner" id="spinner"></div>
    </div>
  </main>

  <div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal">
      <div class="modal-header">
        <h2 class="modal-title" id="modal-title"></h2>
        <button class="close-btn" id="modal-close" type="button" aria-label="Fechar">✕</button>
      </div>
      <img class="modal-gif" id="modal-gif" alt="" />
      <div class="facts" id="modal-facts"></div>
      <div id="modal-muscles"></div>
      <div id="modal-instructions"></div>
    </div>
  </div>

  <script>
    const PAGE_SIZE = 24;
    const API_BASE = /localhost:3030|127\.0\.0\.1:3030/.test(location.origin)
      ? ""
      : "http://localhost:3030";
    const LANG = "pt-br";
    const LANGS = [
      { code: "pt-br", label: "Português" },
      { code: "en", label: "English" },
      { code: "es", label: "Español" },
    ];

    const state = {
      page: 1,
      total: 0,
      totalPages: 0,
      loading: false,
      items: [],
      query: { q: "", body_part: "", equipment: "", muscle: "" },
      taxonomy: { body_parts: {}, equipment: {}, muscles: {} },
    };

    const els = {
      grid: document.getElementById("grid"),
      spinner: document.getElementById("spinner"),
      count: document.getElementById("results-count"),
      search: document.getElementById("search"),
      bodyPart: document.getElementById("body-part"),
      equipment: document.getElementById("equipment"),
      muscle: document.getElementById("muscle"),
      clear: document.getElementById("clear-filters"),
      overlay: document.getElementById("overlay"),
      title: document.getElementById("modal-title"),
      gif: document.getElementById("modal-gif"),
      facts: document.getElementById("modal-facts"),
      muscles: document.getElementById("modal-muscles"),
      instructions: document.getElementById("modal-instructions"),
      close: document.getElementById("modal-close"),
    };

    function debounce(fn, ms) {
      let timer;
      return (...args) => {
        clearTimeout(timer);
        timer = setTimeout(() => fn(...args), ms);
      };
    }

    function hasActiveFilters() {
      return Boolean(state.query.q || state.query.body_part || state.query.equipment || state.query.muscle);
    }

    function setStatus(message) {
      els.grid.replaceChildren();
      const status = document.createElement("p");
      status.className = "status";
      status.textContent = message;
      els.grid.appendChild(status);
    }

    function localized(exercise, language = LANG) {
      return exercise.i18n?.[language] || exercise.i18n?.en || {};
    }

    function exerciseName(exercise, language = LANG) {
      return localized(exercise, language).name || exercise.id;
    }

    function taxonomyLabel(group, slug, language = LANG) {
      if (!slug) return "";
      const labels = state.taxonomy[group]?.[slug];
      return labels?.[language] || labels?.en || slug;
    }

    function muscleLabels(slugs, language = LANG) {
      return (slugs || []).map((slug) => taxonomyLabel("muscles", slug, language));
    }

    function fillSelect(select, items, placeholder) {
      select.replaceChildren();
      const all = document.createElement("option");
      all.value = "";
      all.textContent = placeholder;
      select.appendChild(all);
      items.forEach((item) => {
        const option = document.createElement("option");
        option.value = item.id;
        option.textContent = item.labels?.[LANG] || item.id;
        select.appendChild(option);
      });
    }

    function apiUrl(path) {
      const normalized = path.startsWith("/") ? path : `/${path}`;
      return `${API_BASE}${normalized}`;
    }

    function createCard(exercise) {
      const card = document.createElement("button");
      card.className = "card";
      card.type = "button";
      card.dataset.id = exercise.id;

      const media = document.createElement("div");
      media.className = "card-media";
      const img = document.createElement("img");
      img.src = apiUrl(exercise.media?.thumbnail);
      img.alt = exerciseName(exercise);
      img.loading = "lazy";
      media.appendChild(img);

      const body = document.createElement("div");
      body.className = "card-body";
      const name = document.createElement("h3");
      name.className = "card-name";
      name.textContent = exerciseName(exercise);
      const tags = document.createElement("div");
      tags.className = "card-tags";
      [taxonomyLabel("body_parts", exercise.body_part), taxonomyLabel("equipment", exercise.equipment)]
        .filter(Boolean)
        .forEach((value) => {
        const tag = document.createElement("span");
        tag.className = "tag";
        tag.textContent = value;
        tags.appendChild(tag);
      });

      body.append(name, tags);
      card.append(media, body);
      return card;
    }

    function renderCards(reset) {
      if (reset) els.grid.replaceChildren();
      if (state.items.length === 0) {
        setStatus("Nenhum exercício encontrado.");
        return;
      }
      const fragment = document.createDocumentFragment();
      const start = reset ? 0 : (state.page - 1) * PAGE_SIZE;
      state.items.slice(start).forEach((exercise) => fragment.appendChild(createCard(exercise)));
      els.grid.appendChild(fragment);
    }

    function updateMeta() {
      els.count.textContent = `${state.total.toLocaleString("pt-BR")} exercícios`;
      els.clear.classList.toggle("visible", hasActiveFilters());
      els.spinner.classList.toggle("visible", state.loading || state.page < state.totalPages);
    }

    async function fetchJson(url) {
      const response = await fetch(url);
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      return response.json();
    }

    function buildListUrl(page) {
      const params = new URLSearchParams({ page: String(page), limit: String(PAGE_SIZE) });
      Object.entries(state.query).forEach(([key, value]) => {
        if (value) params.set(key, value);
      });
      return apiUrl(`/exercises?${params}`);
    }

    async function loadPage(reset) {
      if (state.loading) return;
      if (!reset && state.page >= state.totalPages) return;

      state.loading = true;
      if (reset) {
        state.page = 1;
        state.items = [];
        setStatus("Carregando…");
      }
      updateMeta();

      try {
        const page = reset ? 1 : state.page + 1;
        const payload = await fetchJson(buildListUrl(page));
        state.page = payload.page;
        state.total = payload.total;
        state.totalPages = payload.totalPages;
        state.items = reset ? payload.data : state.items.concat(payload.data);
        renderCards(reset);
        queueMicrotask(() => {
          const sentinel = document.getElementById("sentinel");
          if (sentinel.getBoundingClientRect().top < window.innerHeight + 240) {
            loadPage(false);
          }
        });
      } catch {
        if (reset) setStatus("Não foi possível carregar os exercícios. Inicie o servidor com npm start.");
      } finally {
        state.loading = false;
        updateMeta();
      }
    }

    function addFact(label, value) {
      if (!value) return;
      const fact = document.createElement("div");
      fact.className = "fact";
      const small = document.createElement("small");
      small.textContent = label;
      const strong = document.createElement("strong");
      strong.textContent = value;
      fact.append(small, strong);
      els.facts.appendChild(fact);
    }

    function renderMuscles(exercise) {
      els.muscles.replaceChildren();
      const primary = muscleLabels(exercise.muscles?.primary);
      const secondary = muscleLabels(exercise.muscles?.secondary);
      if (primary.length === 0 && secondary.length === 0) return;

      const label = document.createElement("span");
      label.className = "section-label";
      label.textContent = "Músculos";
      const wrap = document.createElement("div");
      wrap.className = "muscles";

      [...primary.map((name) => `Principal: ${name}`), ...secondary]
        .forEach((text) => {
          const tag = document.createElement("span");
          tag.className = "tag";
          tag.textContent = text;
          wrap.appendChild(tag);
        });
      els.muscles.append(label, wrap);
    }

    function stepsFor(exercise, code) {
      const steps = exercise.i18n?.[code]?.steps;
      return Array.isArray(steps) ? steps : [];
    }

    function renderInstructions(exercise) {
      els.instructions.replaceChildren();
      const available = LANGS.map((lang) => ({ ...lang, steps: stepsFor(exercise, lang.code) }))
        .filter((lang) => lang.steps.length > 0);
      if (available.length === 0) return;

      const label = document.createElement("span");
      label.className = "section-label";
      label.textContent = "Como fazer";
      els.instructions.appendChild(label);

      const list = document.createElement("div");
      list.className = "steps";

      const draw = (steps) => {
        list.replaceChildren();
        steps.forEach((text, index) => {
          const row = document.createElement("div");
          row.className = "step";
          const num = document.createElement("span");
          num.className = "step-num";
          num.textContent = String(index + 1);
          const body = document.createElement("span");
          body.textContent = text;
          row.append(num, body);
          list.appendChild(row);
        });
      };

      if (available.length > 1) {
        const tabs = document.createElement("div");
        tabs.className = "lang-tabs";
        available.forEach((lang, index) => {
          const tab = document.createElement("button");
          tab.className = `lang-tab${index === 0 ? " active" : ""}`;
          tab.type = "button";
          tab.textContent = lang.label;
          tab.addEventListener("click", () => {
            tabs.querySelectorAll(".lang-tab").forEach((item) => item.classList.remove("active"));
            tab.classList.add("active");
            draw(lang.steps);
          });
          tabs.appendChild(tab);
        });
        els.instructions.appendChild(tabs);
      }

      draw(available[0].steps);
      els.instructions.appendChild(list);
    }

    function openModal(exercise) {
      els.title.textContent = exerciseName(exercise);
      els.gif.src = exercise.media?.animation ? apiUrl(exercise.media.animation) : "";
      els.gif.alt = exerciseName(exercise);
      els.facts.replaceChildren();
      addFact("Parte do corpo", taxonomyLabel("body_parts", exercise.body_part));
      addFact("Equipamento", taxonomyLabel("equipment", exercise.equipment));
      addFact("Alvo", muscleLabels(exercise.muscles?.primary).join(", "));
      renderMuscles(exercise);
      renderInstructions(exercise);
      els.overlay.classList.add("open");
    }

    function closeModal() {
      els.overlay.classList.remove("open");
      els.gif.src = "";
    }

    async function loadFilters() {
      const [filters, taxonomy] = await Promise.all([
        fetchJson(apiUrl("/filters")),
        fetchJson(apiUrl("/taxonomy")),
      ]);
      state.taxonomy = taxonomy;
      fillSelect(els.bodyPart, filters.body_parts, "Todas as partes");
      fillSelect(els.equipment, filters.equipment, "Todos os equipamentos");
      fillSelect(els.muscle, filters.muscles, "Todos os músculos");
    }

    function readFilters() {
      state.query = {
        q: els.search.value.trim(),
        body_part: els.bodyPart.value,
        equipment: els.equipment.value,
        muscle: els.muscle.value,
      };
      loadPage(true);
    }

    els.search.addEventListener("input", debounce(readFilters, 250));
    els.bodyPart.addEventListener("change", readFilters);
    els.equipment.addEventListener("change", readFilters);
    els.muscle.addEventListener("change", readFilters);
    els.clear.addEventListener("click", () => {
      els.search.value = "";
      els.bodyPart.value = "";
      els.equipment.value = "";
      els.muscle.value = "";
      readFilters();
    });
    els.grid.addEventListener("click", (event) => {
      const card = event.target.closest(".card");
      if (!card) return;
      const exercise = state.items.find((item) => item.id === card.dataset.id);
      if (exercise) openModal(exercise);
    });
    els.close.addEventListener("click", closeModal);
    els.overlay.addEventListener("click", (event) => {
      if (event.target === els.overlay) closeModal();
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") closeModal();
    });

    new IntersectionObserver((entries) => {
      if (entries[0].isIntersecting) loadPage(false);
    }, { rootMargin: "240px" }).observe(document.getElementById("sentinel"));

    loadFilters()
      .catch(() => {})
      .finally(() => loadPage(true));
  </script>
</body>
</html>
